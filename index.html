<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a35">
<title>A little closer — Project 19</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://atmrgumbcdoegenrezql.supabase.co';
const SUPABASE_KEY = 'PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE';

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const year = 2026;
const month = 10;
const start = 5;
const end = 19;

const today = new Date();
today.setHours(0, 0, 0, 0);

const grid = document.getElementById('grid');
const entries = {};

async function loadPublishedEntries() {
  const { data, error } = await client
    .from('diary_entries')
    .select('day_date,title,message,style,photo_url,is_published')
    .eq('is_published', true);

  if (error) {
    document.getElementById('countdown').textContent =
      'THE DIARY IS RESTING · PLEASE TRY AGAIN';
    console.error('Diary loading error:', error.message);
    return;
  }

  (data || []).forEach(entry => {
    entries[entry.day_date] = entry;
  });

  renderCalendar();
}

function renderCalendar() {
  grid.innerHTML = '';

  for (let d = start; d <= end; d++) {
    const date = new Date(year, month, d);
    const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const entry = entries[key];

    const isOpen = date <= today;
    const button = document.createElement('button');

    button.className =
      'day ' +
      (isOpen ? 'open' : 'locked') +
      (date.getTime() === today.getTime() ? ' today' : '');

    const number = document.createElement('span');
    number.className = 'num';
    number.textContent = d;

    const weekday = document.createElement('small');
    weekday.textContent = date.toLocaleDateString('en-US', {
      weekday: 'short'
    });

    const label = document.createElement('small');
    label.textContent = entry
      ? '✦ surprise'
      : isOpen
        ? 'open page'
        : '✧ sealed';

    button.append(number, weekday, label);
    button.disabled = !isOpen;

    button.addEventListener('click', () => {
      showEntry(date, entry);
    });

    grid.appendChild(button);
  }

  const target = new Date(2026, 10, 19);
  const days = Math.ceil((target - today) / 86400000);

  document.getElementById('countdown').textContent =
    days > 0
      ? `${days} DAYS UNTIL NOVEMBER 19`
      : 'NOVEMBER 19 · THE SPECIAL DAY';
}

function showEntry(date, entry) {
  const title = document.getElementById('entryTitle');
  const dateText = document.getElementById('entryDate');
  const message = document.getElementById('entryMessage');
  const image = document.getElementById('entryImage');

  dateText.textContent = date.toLocaleDateString('en-US', {
    month: 'long',
    day: 'numeric',
    year: 'numeric'
  });

  if (!entry) {
    title.textContent = 'This page is waiting';
    message.textContent =
      'A little surprise has not been added to this date yet.';
    image.hidden = true;
    image.removeAttribute('src');
  } else {
    title.textContent = entry.title || 'A little note';
    dateText.textContent += ' · ' + (entry.style || 'A little surprise');
    message.textContent = entry.message || '';

    if (entry.photo_url) {
      image.src = entry.photo_url;
      image.hidden = false;
    } else {
      image.hidden = true;
      image.removeAttribute('src');
    }
  }

  const card = document.getElementById('entry');
  card.style.display = 'block';
  card.scrollIntoView({
    behavior: 'smooth',
    block: 'start'
  });
}

loadPublishedEntries();
</script>
</body></html>
